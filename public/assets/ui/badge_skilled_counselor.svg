<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-skilled_counselor" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rim-skilled_counselor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="inner-skilled_counselor" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-skilled_counselor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ribbon tails -->
  <path d="M 78 188 L 60 240 L 100 220 L 128 232 L 156 220 L 196 240 L 178 188 Z"
        fill="#fbbf24" stroke="#92400e" stroke-width="1.5" opacity="0.92"/>
  <path d="M 78 188 L 60 240 L 100 220 Z" fill="#000" opacity="0.12"/>
  <path d="M 178 188 L 196 240 L 156 220 Z" fill="#000" opacity="0.12"/>

  <!-- Outer rim (medal frame) -->
  <circle cx="128" cy="120" r="98" fill="url(#rim-skilled_counselor)" filter="url(#shadow-skilled_counselor)"/>
  <circle cx="128" cy="120" r="98" fill="none" stroke="#78350f" stroke-width="2" opacity="0.45"/>

  <!-- Star burst behind center -->
  <g transform="translate(128 120)" opacity="0.28">
    <polygon points="22.0,0.0 109.5,10.1 99.9,46.1" fill="#ffffff"/>
    <polygon points="19.1,11.0 89.8,63.5 63.5,89.8" fill="#ffffff"/>
    <polygon points="11.0,19.1 46.1,99.9 10.1,109.5" fill="#ffffff"/>
    <polygon points="0.0,22.0 -10.1,109.5 -46.1,99.9" fill="#ffffff"/>
    <polygon points="-11.0,19.1 -63.5,89.8 -89.8,63.5" fill="#ffffff"/>
    <polygon points="-19.1,11.0 -99.9,46.1 -109.5,10.1" fill="#ffffff"/>
    <polygon points="-22.0,0.0 -109.5,-10.1 -99.9,-46.1" fill="#ffffff"/>
    <polygon points="-19.1,-11.0 -89.8,-63.5 -63.5,-89.8" fill="#ffffff"/>
    <polygon points="-11.0,-19.1 -46.1,-99.9 -10.1,-109.5" fill="#ffffff"/>
    <polygon points="-0.0,-22.0 10.1,-109.5 46.1,-99.9" fill="#ffffff"/>
    <polygon points="11.0,-19.1 63.5,-89.8 89.8,-63.5" fill="#ffffff"/>
    <polygon points="19.1,-11.0 99.9,-46.1 109.5,-10.1" fill="#ffffff"/>
  </g>

  <!-- Inner medallion -->
  <circle cx="128" cy="120" r="80" fill="url(#bg-skilled_counselor)"/>
  <circle cx="128" cy="120" r="80" fill="url(#inner-skilled_counselor)"/>
  <circle cx="128" cy="120" r="80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>

  <!-- Tiny stars decoration -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="78" cy="78" r="2.5"/>
    <circle cx="178" cy="78" r="2"/>
    <circle cx="68" cy="138" r="1.8"/>
    <circle cx="188" cy="138" r="2.2"/>
    <circle cx="92" cy="58" r="1.5"/>
  </g>

  <!-- Central emoji glyph -->
  <text x="128" y="120" font-size="84" text-anchor="middle" dominant-baseline="central"
        font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🎯</text>
</svg>
